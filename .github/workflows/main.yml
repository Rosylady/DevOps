name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 26
        uses: actions/setup-java@v2
        with:
          java-version: '26'
          distribution: 'adopt'
      - name: Setup network
        run: |
          docker network create --driver bridge se-methodsupdate
          docker pull mongo
          docker run -d --name mongo-dbserverupdate --network se-methodsupdate mongo
      - name: Build with Maven
        run: mvn package
      - name: Build
        run: docker build -t se_methodsupdate .
      - name: Run image
        run: docker run --network se-methodsupdate --name DevOps se-methodsupdate
      - name: view logs
        run: docker logs DevOps
